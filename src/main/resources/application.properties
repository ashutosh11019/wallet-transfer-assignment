# Server Port
server.port=8080

# SQLite Datasource Configuration
spring.datasource.url=jdbc:sqlite:wallet.db?journal_mode=WAL&busy_timeout=10000&transaction_mode=IMMEDIATE&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Continue on error so duplicate key errors on static data inserts don't halt startup
spring.sql.init.continue-on-error=true
